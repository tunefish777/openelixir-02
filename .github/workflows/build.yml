name: Build

# Pushing a tag v<version> (matching project(VERSION) in CMakeLists.txt) also
# publishes a GitHub release with the firmware, using the notes in
# .github/releases/v<version>.md.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Arm GNU Toolchain used for the build. The ITCM is nearly full, so the
  # compiler version matters: change all three values together.
  # Releases: https://gitlab.arm.com/tooling/gnu-toolchains-for-arm (branch releases/<version>)
  TOOLCHAIN_VERSION: 15.3.rel2
  TOOLCHAIN_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz
  TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a

jobs:
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # for publishing releases on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          # the normal firmware (the only one that is released)
          - variant: release
            cmake_args: ""
          # development build with the CPU load meter, built so that it keeps compiling
          - variant: cpumeter
            cmake_args: -DLXR_CPU_METER=ON
    name: firmware (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-toolchain
          key: arm-gnu-toolchain-${{ env.TOOLCHAIN_SHA256 }}

      - name: Download toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o toolchain.tar.xz "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_SHA256  toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-toolchain
          tar xf toolchain.tar.xz -C ~/arm-toolchain --strip-components=1
          rm toolchain.tar.xz

      - name: Configure
        run: cmake --preset release -B build/${{ matrix.variant }} -DARM_TOOLCHAIN_DIR=$HOME/arm-toolchain/bin ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build/${{ matrix.variant }}

      - name: Memory usage summary
        run: |
          {
            echo '## Memory usage (${{ matrix.variant }})'
            echo '```'
            python3 cmake/tools/memreport.py build/${{ matrix.variant }}/OpenElixir-02.elf \
              --baseline memory_baseline.json --top 15 --no-history
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenElixir-02-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build/${{ matrix.variant }}/*.img
            build/${{ matrix.variant }}/*.elf
            build/${{ matrix.variant }}/*.bin
            build/${{ matrix.variant }}/*.hex
            build/${{ matrix.variant }}/*.map
          if-no-files-found: error

      - name: Check release tag and notes
        if: matrix.variant == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $version) in CMakeLists.txt"
            exit 1
          fi
          test -f ".github/releases/$GITHUB_REF_NAME.md" || { echo "::error::Missing .github/releases/$GITHUB_REF_NAME.md"; exit 1; }

      - name: Publish release
        if: matrix.variant == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenElixir-02 ${{ github.ref_name }}
          body_path: .github/releases/${{ github.ref_name }}.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
          files: |
            build/release/*.img
            build/release/*.hex
            build/release/*.elf
